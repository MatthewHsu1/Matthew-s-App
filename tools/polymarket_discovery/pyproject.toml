[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-discovery"
version = "0.1.0"
description = "Offline Phase 1 market discovery skeleton for Polymarket arbitrage baskets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.0.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
polymarket-discovery = "polymarket_discovery.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
