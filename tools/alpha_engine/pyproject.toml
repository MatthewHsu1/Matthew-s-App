[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-engine"
version = "0.1.0"
description = "NautilusTrader-based alpha execution engine. Phase 1: backtest only."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "nautilus_trader>=1.226,<1.227",
  "nautilus-ibapi>=10.0",
  "protobuf>=4.0",
  "pyarrow>=14.0",
  "pandas>=2.0",
  "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-forked>=1.6",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alpha_engine = ["py.typed"]
