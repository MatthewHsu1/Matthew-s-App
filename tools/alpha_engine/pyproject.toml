[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-engine"
version = "0.1.0"
description = "NautilusTrader-based alpha execution engine. Phase 1: backtest only."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "nautilus_trader>=1.190",
  "jsonschema>=4.0.0",
  "pyarrow>=14.0",
  "pandas>=2.0",
  "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
alpha-engine = "alpha_engine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alpha_engine = ["config/schema/*.json", "configs/templates/*.json"]
